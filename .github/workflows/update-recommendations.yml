name: 추천 종목 갱신

# 매일 자동 실행 + 수동 실행 가능
on:
  schedule:
    # UTC 기준. 07:10 UTC = KST 16:10 (국장 마감 직후), 평일만
    - cron: "10 7 * * 1-5"
    # 21:10 UTC = KST 06:10 (미장 마감 후, 다음날 아침 갱신용), 화~토
    - cron: "10 21 * * 2-6"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼

# JSON을 저장소에 커밋하려면 쓰기 권한 필요
permissions:
  contents: write

# 동시 실행 방지 (이전 실행이 끝나기 전 새로 시작 막기)
concurrency:
  group: update-recommendations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # Twelve Data 무료 한도로 US 수집이 ~8분 걸림

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install requests

      - name: 추천 엔진 실행
        id: engine
        env:
          # API 키는 GitHub Secrets에서 주입 (코드/로그에 노출 안 됨)
          KIS_VIRTUAL: "1"
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          # 저장소 루트에 고정 출력 → 앱이 raw URL로 받음
          OUTPUT_PATH: ${{ github.workspace }}/recommendations.json
          PYTHONIOENCODING: "utf-8"
        run: |
          echo "::group::엔진 실행"
          python -m files.main
          echo "::endgroup::"
          echo "=== 생성 확인 ==="
          ls -l recommendations.json
          python -c "import json; d=json.load(open('recommendations.json')); print('KR', len(d['markets']['KR']), 'US', len(d['markets']['US']))"

      - name: 변경분 커밋 & 푸시
        id: commit
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recommendations.json
          echo "=== git status ==="
          git status --short
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 추천 종목 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
            # 워크플로우 실행 중 main이 갱신됐을 수 있어 rebase 후 푸시(비-fast-forward 방지)
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
